name: publish

# One tag publishes everything: PyPI (Trusted Publishing), the official MCP
# Registry (GitHub OIDC) and the GitHub release (notes from CHANGELOG.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches every version field
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import json, os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "mcp_secret_sentinel/__init__.py": re.search(r'__version__ = "([^"]+)"', open("mcp_secret_sentinel/__init__.py").read()).group(1),
              "server.json": json.load(open("server.json"))["version"],
              "server.json packages[0]": json.load(open("server.json"))["packages"][0]["version"],
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
          }
          wrong = {k: v for k, v in versions.items() if v != tag}
          if wrong:
              raise SystemExit(f"Tag v{tag} does not match: {wrong}")
          print(f"All version fields are {tag}")
          EOF
      - run: pip install build pytest -e .
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/mcp-secret-sentinel/$version/json" > /dev/null; then
              echo "PyPI serves $version"; exit 0
            fi
            sleep 10
          done
          echo "PyPI never served $version" >&2; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section between "## [<version>]" and the next "## [" heading.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
