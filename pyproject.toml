[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-secret-sentinel"
version = "0.1.0"
description = "MCP server that scans code for exposed secrets — API keys, tokens, private keys and high-entropy strings — with placeholder-aware allowlisting and redacted reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alejandro Brito", email = "alejandrobritoolivera@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "claude", "ai-agents", "security", "secrets-detection", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AleBrito124356/mcp-secret-sentinel"
Source = "https://github.com/AleBrito124356/mcp-secret-sentinel"
Issues = "https://github.com/AleBrito124356/mcp-secret-sentinel/issues"

[project.scripts]
mcp-secret-sentinel = "mcp_secret_sentinel.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_secret_sentinel"]
